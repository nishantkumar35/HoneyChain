{% extends 'base.html' %}
{% block title %}Delete Batch{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-3xl shadow-sm border border-red-100 p-8 text-center">
    <div class="text-5xl mb-4">⚠️</div>
    <h2 class="text-2xl font-extrabold text-cocoa mb-2">Delete Batch?</h2>
    <p class="font-bold text-cocoa text-lg mb-6">{{ batch.batch_id }}</p>
    <div class="flex gap-3 justify-center">
      <form method="POST">
        {% csrf_token %}
        <button type="submit" class="bg-red-500 text-white px-8 py-3 rounded-2xl font-bold hover:bg-red-600 transition-all">Yes, Delete</button>
      </form>
      <a href="{% url 'honey:detail' batch.pk %}" class="bg-gray-100 text-gray-600 px-8 py-3 rounded-2xl font-bold hover:bg-gray-200 transition-all">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
