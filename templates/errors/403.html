{% extends 'base.html' %}
{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-sm border border-amber-100 p-8 text-center">
    <div class="text-6xl mb-4">🚫</div>
    <h1 class="text-4xl font-extrabold text-cocoa mb-2">403</h1>
    <h2 class="text-xl font-bold text-gray-700 mb-4">Permission Denied</h2>
    <p class="text-gray-500 text-sm mb-6">
      You do not have permission to view or modify this resource. Only the owner of this record has access.
    </p>
    <a href="{% url 'accounts:dashboard' %}" class="inline-block bg-honey text-white px-6 py-3 rounded-2xl font-bold hover:bg-orange-600 transition-all">
      Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
