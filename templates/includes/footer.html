<!-- HoneyChain Figma Design Footer -->
<footer class="bg-cream border-t border-line/60 mt-16 no-print">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex flex-col md:flex-row items-center justify-between gap-6">

      <!-- Brand & Tagline matching Image 4 -->
      <div class="flex flex-col sm:flex-row items-center gap-3 text-center sm:text-left">
        <a href="{% url 'home' %}" class="flex items-center gap-2 group">
          <div class="w-6 h-6 rounded-md flex items-center justify-center">
            <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
              <polygon points="14,2 25,8 25,20 14,26 3,20 3,8" fill="#F8C928" stroke="#573A34" stroke-width="2"/>
            </svg>
          </div>
          <span class="font-bold text-lg text-cocoa font-display">HoneyChain</span>
        </a>
        <span class="hidden sm:inline text-cocoa-soft text-sm">•</span>
        <p class="text-xs text-cocoa-soft">
          © 2026 HoneyChain. Honest honey, traced from hive to jar.
        </p>
      </div>

      <!-- Footer Nav Links matching Image 4 -->
      <div class="flex flex-wrap justify-center items-center gap-6 text-xs font-bold text-cocoa-soft">
        <a href="{% url 'home' %}" class="hover:text-honey-deep transition-colors">Home</a>
        {% if user.is_authenticated %}
        <a href="{% url 'accounts:dashboard' %}" class="hover:text-honey-deep transition-colors">Dashboard</a>
        <a href="{% url 'apiaries:list' %}" class="hover:text-honey-deep transition-colors">Apiaries</a>
        <a href="{% url 'honey:list' %}" class="hover:text-honey-deep transition-colors">Honey Batches</a>
        {% endif %}
        <a href="{% url 'traceability:search' %}" class="hover:text-honey-deep transition-colors">Traceability</a>
        <a href="{% url 'about' %}" class="hover:text-honey-deep transition-colors">About</a>
      </div>

    </div>
  </div>
</footer>
